  <style>
body{
    background-color: #0a0202;
    overflow-y: hidden;
    overflow-x: hidden;
}
.square{
    position: relative;
    width:400px;
    height:400px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.square span:nth-child(1){
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image: radial-gradient(#6b72ff00 50%,#000dff3b);
    box-shadow: 0 0 50px rgb(25,0,255),inset 0 0 50px rgb(25,0,255);
    border-radius: 36% 62% 63% 37% / 41% 44% 56% 59%;
    transition: 0.5s;
    animation: animate1 6s linear infinite;
}
.square span:nth-child(2){
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image: radial-gradient(#6b72ff00 50%,#000dff3b);
    box-shadow: 0 0 50px rgb(25,0,255),inset 0 0 50px rgb(25,0,255);
    border-radius: 36% 62% 63% 37% / 41% 44% 56% 59%;
    transition: 0.5s;
    animation: animate2 4s linear infinite;
}
.square span:nth-child(3){
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background-image: radial-gradient(#6b72ff00 50%,#000dff3b);
    box-shadow: 0 0 50px rgb(25,0,255),inset 0 0 50px rgb(25, 0, 255);
    border-radius: 36% 62% 63% 37% / 41% 44% 56% 59%;
    transition: 0.5s;
    animation: animate3 8s linear infinite;
}
@keyframes animate1{
    0%{
        transform: rotate(0deg);
    }
    100%{
        transform: rotate(360deg); 
    }
}
@keyframes animate2{
    0%{
        transform: rotate(0deg);
    }
    100%{
        transform: rotate(360deg);
    }
}
@keyframes animate3{
    0%{
        transform: rotate(0deg);
    }
    100%{
        transform: rotate(360deg);
    }
}
/* Animate.css is required for textillate effects */
@import url('https://ajax.googleapis.com/ajax/libs/3.6.4/jquery.min.js');

/* Style for the text container */
.h4 {
    font-size: 2.5rem;           /* Make the text large */
    font-weight: bold;           /* Bold text */
    color: #007BFF;              /* A blue color */
    text-align: center;          /* Center align */
    margin-top: 50px;            /* Some spacing from top */
    letter-spacing: 2px;         /* Space between letters */
    text-transform: uppercase;   /* All caps */
    font-family: 'Arial', sans-serif; /* Clean font */
}

  </style>

                 </div>

                </div>
            </div>
